<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>תהליכי עבודה אינטראקטיביים</title>
  <style>
    :root{--bg:#edf4f8;--card:#fff;--ink:#122033;--muted:#65758a;--line:#dce7ef;--accent:#0f766e;--navy:#0f2033;--soft:#f7fafc;--shadow:0 14px 34px rgba(15,23,42,.10)}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;overflow:hidden;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(circle at 10% 10%,rgba(15,118,110,.13),transparent 260px),linear-gradient(180deg,#f8fafc,var(--bg));color:var(--ink);direction:rtl} button,input{font:inherit} button{cursor:pointer}
    .app{height:100vh;padding:10px;display:grid;grid-template-rows:auto 1fr;gap:10px}.topShell{display:block}.topbar{min-height:58px;display:grid;grid-template-columns:1fr minmax(220px,360px) auto;gap:10px;align-items:center;position:relative;padding:8px 12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 22px rgba(15,23,42,.07)}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}h1{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:7px 10px;display:flex;gap:8px}.search input{border:0;outline:0;background:transparent;width:100%}.tabs{display:flex;gap:6px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:white;color:var(--muted);white-space:nowrap}.pill.active{background:var(--navy);color:white;border-color:var(--navy)}
    .layout{min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:10px}.side{grid-column:1}.work{grid-column:2}.side,.work{min-height:0;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.side{padding:10px;display:flex;flex-direction:column;gap:8px}.sideTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.sideTitle{font-weight:800;font-size:14px}.processList{display:grid;gap:8px;overflow:auto}.processBtn{width:100%;text-align:right;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:16px;background:white;padding:9px}.processBtn.active{border-color:var(--accent);box-shadow:0 8px 18px rgba(15,118,110,.13)}.icon{width:34px;height:34px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}.processBtn b{display:block;font-size:14px;line-height:1.15}.processBtn span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    .work{display:flex;flex-direction:column}.workHead{flex:0 0 auto;padding:10px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(15,118,110,.08),white 65%);display:flex;align-items:center;justify-content:space-between;gap:10px}.workHead h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workHead p{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{display:flex;align-items:center;gap:8px;min-width:170px;color:var(--muted);font-size:12px}.bar{flex:1;height:8px;background:#e6edf4;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:var(--accent)}.content{flex:1;min-height:0;overflow:auto;padding:10px}.hidden{display:none!important}.empty{border:1px dashed var(--line);border-radius:16px;background:#fff;padding:18px;color:var(--muted)}
    .checkWrap{min-height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px}.stepNav{display:grid;gap:6px;align-self:start}.stepNav button{border:1px solid var(--line);background:white;border-radius:12px;padding:8px;text-align:right;font-size:12px;color:var(--muted)}.stepNav button.active{border-color:var(--accent);background:rgba(15,118,110,.08);color:var(--ink);font-weight:800}.stage{min-height:calc(100vh - 170px);border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 4px 12px rgba(15,23,42,.04);padding:18px;display:flex;flex-direction:column}.meta{color:var(--accent);font-size:12px;font-weight:900}.stage h3{margin:8px 0 4px;font-size:25px}.purpose{margin:0 0 12px;border:1px solid rgba(15,118,110,.22);border-radius:14px;background:rgba(15,118,110,.06);padding:9px 10px;color:var(--muted);font-size:13px;line-height:1.35}.purpose b{color:var(--accent)}.hint{margin:0 0 14px;color:var(--muted);font-size:13px}.checks{display:grid;gap:8px}.check{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:14px;background:var(--soft)}.check.done{background:rgba(15,118,110,.08);border-color:rgba(15,118,110,.32)}.check input{accent-color:var(--accent);width:17px;height:17px;margin-top:1px}.nav{margin-top:auto;padding-top:14px;display:flex;gap:8px}.nav button{border:0;border-radius:12px;padding:9px 14px;background:var(--navy);color:white}.nav button:disabled{opacity:.35;cursor:default}
    .treeMap{min-height:calc(100vh - 170px);display:grid;grid-template-rows:auto 1fr;gap:12px}.treeRoot{border:1px solid rgba(15,118,110,.32);border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,rgba(15,118,110,.12),white 70%);display:flex;justify-content:space-between;gap:12px;align-items:center}.treeRoot b{font-size:18px}.treeRoot span{color:var(--muted);font-size:12px}.num{width:32px;height:32px;border-radius:11px;background:var(--accent);color:white;display:grid;place-items:center;font-size:12px;font-weight:900}.treeSteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-content:start}.treeCard{position:relative;border:1px solid var(--line);border-radius:16px;background:white;padding:10px;box-shadow:0 4px 12px rgba(15,23,42,.04)}.treeCard:before{content:'';position:absolute;top:-11px;right:28px;width:2px;height:11px;background:var(--line)}.treeCard h3{margin:8px 0 8px;font-size:14px}.treeItems{display:grid;gap:5px}.treeMiniItem{border-radius:9px;background:var(--soft);border:1px solid var(--line);padding:5px 6px;font-size:11.5px;line-height:1.25}
    @media(max-width:860px){body{overflow:auto}.app{height:auto;min-height:100vh}.topbar,.layout,.checkWrap{grid-template-columns:1fr}.side,.work{grid-column:auto}.side{order:-1}.workHead{align-items:flex-start;flex-direction:column}.stage{min-height:auto}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topShell"><header class="topbar">
      <div class="brand"><div class="logo">LMS</div><div><h1>תהליכי עבודה אינטראקטיביים</h1><p class="subtitle">צ׳ק ליסט מודרך ותרשים פתוח של תהליך העבודה.</p></div></div>
      <label class="search">🔎 <input id="search" placeholder="חיפוש בתוך התהליכים"></label>
      <nav class="tabs"><button class="pill active" data-view="checklist">צ׳ק ליסט</button><button class="pill" data-view="diagram">תרשים</button></nav></header></div>
    <section class="layout">
      <aside class="side"><div class="sideTop"><div class="sideTitle">תהליכים</div></div><div class="processList" id="processList"></div></aside>
      <section class="work"><header class="workHead"><div><h2 id="title"></h2><p id="desc"></p></div><div class="progress"><span id="progressText">0%</span><div class="bar"><div id="progressBar"></div></div></div></header><div class="content"><div id="checkView"></div><div id="diagramView" class="hidden"></div></div></section>
    </section>
  </main>
<script>
const defaultProcesses = [
  {id:'new-client',icon:'+',accent:'#0f766e',title:'הקמת לקוח חדש',desc:'מעבר מסודר מהזמנת לקוח לפתיחת סביבת עבודה, טעינת תכנים והפעלה.',steps:[{title:'קבלת פרטי ההזמנה',items:['בדיקת פרטי לקוח ואיש קשר','בדיקת שם הלומדה / השירות','וידוא תאריך יעד וציפיות ראשוניות']},{title:'פתיחת סביבת עבודה',items:['הקמת לקוח במערכת LMS','הגדרת שם, הרשאות ומבנה בסיסי','בדיקה שהסביבה זמינה']},{title:'טעינת תכנים',items:['העלאת קובצי הלומדה','בדיקת תקינות טעינה','שיוך התוכן לסביבת הלקוח']},{title:'הגדרות משתמשים והרשאות',items:['קבלת רשימת משתמשים','שיוך משתמשים לתוכן','בדיקת הרשאות וצפייה']},{title:'בדיקת תקינות לפני שליחה',items:['כניסה כמשתמש','בדיקת פתיחה, מעבר וסיום','בדיקת דוחות בסיסיים']},{title:'שליחה ללקוח',items:['שליחת קישור והנחיות','עדכון סטטוס במעקב','שמירת תיעוד בתיקיית הפרויקט']}]},
  {id:'renew-client',icon:'↻',accent:'#2563eb',title:'חידוש לקוח קיים',desc:'עדכון מחזור פעילות ללקוח קיים תוך שמירה על רצף תיעוד ובקרה.',steps:[{title:'זיהוי סביבת הלקוח',items:['איתור הלקוח במערכת','בדיקה מה קיים במחזור הקודם','בדיקת אנשי קשר ועדכונים']},{title:'עדכון תכנים והקצאות',items:['בדיקת גרסת הלומדה','עדכון שיוכים לפי הצורך','הסרת שיוכים לא רלוונטיים']},{title:'איפוס / פתיחת מחזור חדש',items:['הגדרת תקופת פעילות חדשה','בדיקת שמירת נתוני עבר','וידוא שהמשתמשים רואים את המחזור הנכון']},{title:'בדיקת תקינות',items:['בדיקת קישור','בדיקת משתמש לדוגמה','בדיקת דוח מעקב ראשוני']},{title:'עדכון לקוח',items:['שליחת הודעה מסודרת','צירוף קישור והנחיות','עדכון סטטוס במעקב']}]},
  {id:'monthly-report',icon:'▦',accent:'#7c3aed',title:'דוח חודשי',desc:'איסוף נתוני ביצוע, בדיקת איכות הנתונים ושליחה מסודרת ללקוח.',steps:[{title:'איסוף נתונים',items:['כניסה לדוח הרלוונטי במערכת','בחירת טווח תאריכים','ייצוא קובץ נתונים']},{title:'בדיקת הנתונים',items:['בדיקת כפילויות או חוסרים','בדיקת סטטוסי סיום','ווידוא התאמה למספר המשתמשים הצפוי']},{title:'עיבוד וסידור הקובץ',items:['שינוי שם הקובץ לפי לקוח ותאריך','סידור עמודות מרכזיות','שמירת גרסה סופית בתיקייה']},{title:'שליחה ותיעוד',items:['שליחת הדוח ללקוח','תיעוד תאריך השליחה','סימון שהדוח נשלח']}]},
  {id:'project-close',icon:'✓',accent:'#ea580c',title:'סיום פרויקט',desc:'סגירת קצוות: תיעוד, שמירת חומרים, עדכון סטטוסים והעברה לארכיון.',steps:[{title:'וידוא סיום מול הלקוח',items:['בדיקה שהלקוח אישר סיום','וידוא שאין הערות פתוחות','שמירת האישור בתיעוד']},{title:'סגירת משימות',items:['סימון משימות כבוצעו','עדכון סטטוס סופי','בדיקת משימות פתוחות אחרונות']},{title:'שמירת חומרים',items:['שמירת קבצים סופיים','ארגון תיקיית הפרויקט','העברת חומרים למיקום הקבוע']},{title:'ארכוב ותיעוד',items:['העברת מיילים לתיקייה מתאימה','עדכון מערכת המעקב','שמירת הערות להמשך אם צריך']}]}];
const checksKey='lms-process-checks-final-v1';
let processes=JSON.parse(JSON.stringify(defaultProcesses));
let selectedId=processes[0] ? processes[0].id : '';
let view='checklist';
let stepIndex=0;
let query='';
const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
function esc(s){return String(s ?? '').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function getChecks(){try{return JSON.parse(localStorage.getItem(checksKey)||'{}');}catch(e){return {};}}
function saveChecks(obj){try{localStorage.setItem(checksKey,JSON.stringify(obj));}catch(e){}}
function checkKey(pid,si,ii){return pid+':'+si+':'+ii;}
function isChecked(pid,si,ii){return !!getChecks()[checkKey(pid,si,ii)];}
function setChecked(pid,si,ii,val){const obj=getChecks();const k=checkKey(pid,si,ii);if(val)obj[k]=true;else delete obj[k];saveChecks(obj);}
function current(){return processes.find(p=>p.id===selectedId)||processes[0];}
function filteredProcessList(){const q=query.trim().toLowerCase();if(!q)return processes;return processes.filter(p=>([p.title,p.desc].concat(p.steps.flatMap(s=>[s.title].concat(s.items))).join(' ').toLowerCase().includes(q)));}
function filteredSteps(p){const q=query.trim().toLowerCase();return p.steps.map((s,i)=>({title:s.title,items:s.items,original:i})).filter(s=>!q||([s.title].concat(s.items)).join(' ').toLowerCase().includes(q));}
function renderProcessList(){const list=filteredProcessList();if(!processes.find(p=>p.id===selectedId))selectedId=processes[0]?.id;if(list.length&&!list.find(p=>p.id===selectedId))selectedId=list[0].id;$('#processList').innerHTML=list.map(p=>'<button class="processBtn '+(p.id===selectedId?'active':'')+'" data-id="'+esc(p.id)+'"><div class="icon" style="background:'+esc(p.accent||'#0f766e')+'">'+esc(p.icon||'•')+'</div><div><b>'+esc(p.title||'תהליך ללא שם')+'</b><span>'+p.steps.length+' שלבים · '+p.steps.reduce((n,s)=>n+s.items.length,0)+' פעולות</span></div></button>').join('')||'<div class="empty">לא נמצאו תהליכים.</div>';$$('.processBtn').forEach(btn=>{btn.onclick=()=>{selectedId=btn.dataset.id;stepIndex=0;render();};});}
function updateHeader(){const p=current();if(!p)return;document.documentElement.style.setProperty('--accent',p.accent||'#0f766e');$('#title').textContent=p.title||'תהליך ללא שם';$('#desc').textContent=p.desc||'אין תיאור לתהליך הזה עדיין.';let total=0,done=0;p.steps.forEach((s,si)=>s.items.forEach((it,ii)=>{total++;if(isChecked(p.id,si,ii))done++;}));const pct=total?Math.round(done/total*100):0;$('#progressText').textContent=pct+'%';$('#progressBar').style.width=pct+'%';}
function renderChecklist(){const p=current();if(!p)return;const steps=filteredSteps(p);if(!steps.length){$('#checkView').innerHTML='<div class="empty">לא נמצאו שלבים שמתאימים לחיפוש.</div>';return;}stepIndex=Math.max(0,Math.min(stepIndex,steps.length-1));const s=steps[stepIndex];const si=s.original;let html='<div class="checkWrap"><aside class="stepNav">';steps.forEach((st,i)=>{html+='<button class="'+(i===stepIndex?'active':'')+'" data-i="'+i+'">'+(i+1)+'. '+esc(st.title)+'</button>';});html+='</aside><article class="stage"><div class="meta">שלב '+(stepIndex+1)+' מתוך '+steps.length+'</div><h3>'+esc(s.title)+'</h3><p class="purpose"><b>מטרת התהליך:</b> '+esc(p.desc)+'</p><p class="hint">סמן פעולה פעולה תוך כדי התקדמות בתהליך.</p><div class="checks">';s.items.forEach((item,ii)=>{const done=isChecked(p.id,si,ii);html+='<label class="check '+(done?'done':'')+'"><input type="checkbox" data-si="'+si+'" data-ii="'+ii+'" '+(done?'checked':'')+'><span>'+esc(item)+'</span></label>';});html+='</div><div class="nav"><button id="prev" '+(stepIndex===0?'disabled':'')+'>הקודם</button><button id="next" '+(stepIndex===steps.length-1?'disabled':'')+'>הבא</button></div></article></div>';$('#checkView').innerHTML=html;$('#prev').onclick=()=>{stepIndex--;renderChecklist();};$('#next').onclick=()=>{stepIndex++;renderChecklist();};$$('.stepNav button',$('#checkView')).forEach(btn=>{btn.onclick=()=>{stepIndex=Number(btn.dataset.i);renderChecklist();};});$$('input[type="checkbox"]',$('#checkView')).forEach(cb=>{cb.onchange=()=>{setChecked(p.id,Number(cb.dataset.si),Number(cb.dataset.ii),cb.checked);cb.closest('.check').classList.toggle('done',cb.checked);updateHeader();};});}
function renderDiagram(){const p=current();if(!p)return;const steps=filteredSteps(p);if(!steps.length){$('#diagramView').innerHTML='<div class="empty">לא נמצאו שלבים שמתאימים לחיפוש.</div>';return;}let html='<section class="treeMap"><div class="treeRoot"><div><b>'+esc(p.title)+'</b><br><span>'+esc(p.desc)+'</span><br><span>'+steps.length+' שלבים מוצגים בתמונה אחת · '+steps.reduce((n,s)=>n+s.items.length,0)+' פעולות</span></div><div class="num">'+esc(p.icon||'•')+'</div></div><div class="treeSteps">';steps.forEach((s,i)=>{html+='<article class="treeCard"><div class="num">'+String((s.original??i)+1).padStart(2,'0')+'</div><h3>'+esc(s.title)+'</h3><div class="treeItems">';s.items.forEach(item=>{html+='<div class="treeMiniItem">'+esc(item)+'</div>';});html+='</div></article>';});html+='</div></section>';$('#diagramView').innerHTML=html;}
function switchView(next){view=next;$$('.pill').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));$('#checkView').classList.toggle('hidden',view!=='checklist');$('#diagramView').classList.toggle('hidden',view!=='diagram');}
function render(){renderProcessList();updateHeader();renderChecklist();renderDiagram();switchView(view);} 
$$('.pill').forEach(btn=>{btn.onclick=()=>switchView(btn.dataset.view);});
$('#search').oninput=e=>{query=e.target.value;stepIndex=0;render();};
render();
</script>
</body>
</html>
